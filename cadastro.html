<div class="modal-overlay" id="login-modal">
    <div class="modal-card">
      <button class="modal-close" onclick="closeLoginModal()"><i class="fa-solid fa-xmark"></i></button>
      
      <div class="modal-header">
        <div class="modal-icon"><i class="fa-solid fa-user-astronaut"></i></div>
        <h2>Cadastro / Identificação</h2>
        <p>Insira os seus dados para registar a pontuação no banco de dados!</p>
      </div>
  
      <form id="login-form" onsubmit="handleUserSubmit(event)">
        <div class="form-group">
          <label for="username">Nome de Utilizador</label>
          <input type="text" id="username" class="form-control" placeholder="Ex: Maria Silva" required>
        </div>
  
        <div class="form-group">
          <label>Escolha o seu Avatar</label>
          <div class="avatar-selector">
            <label class="avatar-option">
              <input type="radio" name="avatar" value="🎓" checked>
              <span class="avatar-box">🎓</span>
            </label>
            <label class="avatar-option">
              <input type="radio" name="avatar" value="🚀">
              <span class="avatar-box">🚀</span>
            </label>
            <label class="avatar-option">
              <input type="radio" name="avatar" value="🌟">
              <span class="avatar-box">🌟</span>
            </label>
            <label class="avatar-option">
              <input type="radio" name="avatar" value="💡">
              <span class="avatar-box">💡</span>
            </label>
            <label class="avatar-option">
              <input type="radio" name="avatar" value="🌍">
              <span class="avatar-box">🌍</span>
            </label>
          </div>
        </div>
  
        <button type="submit" class="btn btn-primary full-width">Iniciar Quiz <i class="fa-solid fa-play"></i></button>
      </form>
    </div>
  </div>
